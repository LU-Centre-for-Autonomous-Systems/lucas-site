name: Open PR for bot updates

on:
  push:
    branches: ['bot/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "Site update: $GITHUB_REF_NAME" \
            --body "Automated site update from the LUCAS mailbox pipeline. Review the diff before merging." \
            || echo "PR already exists for this branch"
